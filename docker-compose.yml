version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: padel_postgres
    restart: always
    environment:
      POSTGRES_USER: padel_user
      POSTGRES_PASSWORD: padel_password
      POSTGRES_DB: padel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: padel_redis
    restart: always
    # ✅ FIX CRITICITÀ D: AOF attivo per persistenza job wave/reminder su crash
    command: redis-server --appendonly yes --appendfsync everysec --auto-aof-rewrite-percentage 100 --auto-aof-rewrite-min-size 64mb
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
